apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-backend
  namespace: liyu-bingo
  labels:
    app: django-backend
spec:
  replicas: 3  # Horizontal scaling - can be increased
  selector:
    matchLabels:
      app: django-backend
  template:
    metadata:
      labels:
        app: django-backend
    spec:
      containers:
      - name: django
        image: liyu-bingo/django:latest  # Replace with your image
        ports:
        - containerPort: 8000
        env:
        - name: DJANGO_SETTINGS_MODULE
          value: "core.settings_production"
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-service:5432/$(POSTGRES_DB)"
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: REDIS_URL
        - name: DJANGO_SECRET_KEY
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: DJANGO_SECRET_KEY
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: DEBUG
        - name: ALLOWED_HOSTS
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: ALLOWED_HOSTS
        - name: BACK_URL
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: BACK_URL
        - name: MANUAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: liyu-secrets
              key: MANUAL_API_KEY
        - name: MANUAL_BASE_URL
          valueFrom:
            secretKeyRef:
              name: liyu-secrets
              key: MANUAL_BASE_URL
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: liyu-secrets
              key: POSTGRES_PASSWORD
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
      initContainers:
      - name: django-migrate
        image: liyu-bingo/django:latest
        command: ["python", "manage.py", "migrate", "--noinput"]
        env:
        - name: DJANGO_SETTINGS_MODULE
          value: "core.settings_production"
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-service:5432/$(POSTGRES_DB)"
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: liyu-secrets
              key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: django-service
  namespace: liyu-bingo
spec:
  selector:
    app: django-backend
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: django-hpa
  namespace: liyu-bingo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: django-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
