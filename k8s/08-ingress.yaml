apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: liyu-bingo-ingress
  namespace: liyu-bingo
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - akerbingo.com
    - www.akerbingo.com
    secretName: liyu-bingo-tls
  rules:
  - host: akerbingo.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: react-service
            port:
              number: 80
      - path: /api/
        pathType: Prefix
        backend:
          service:
            name: django-service
            port:
              number: 8000
      - path: /socket.io/
        pathType: Prefix
        backend:
          service:
            name: nodejs-service
            port:
              number: 3000
      - path: /admin/
        pathType: Prefix
        backend:
          service:
            name: django-service
            port:
              number: 8000
  - host: www.akerbingo.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: react-service
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: liyu-bingo-network-policy
  namespace: liyu-bingo
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: liyu-bingo
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: liyu-bingo
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
