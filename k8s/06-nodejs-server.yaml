apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-server
  namespace: liyu-bingo
  labels:
    app: nodejs-server
spec:
  replicas: 3  # Horizontal scaling
  selector:
    matchLabels:
      app: nodejs-server
  template:
    metadata:
      labels:
        app: nodejs-server
    spec:
      containers:
      - name: nodejs
        image: liyu-bingo/nodejs:latest  # Replace with your image
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: PORT
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: REDIS_URL
        - name: DJANGO_API_URL
          value: "http://django-service:8000"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        startupProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: nodejs-service
  namespace: liyu-bingo
spec:
  selector:
    app: nodejs-server
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nodejs-hpa
  namespace: liyu-bingo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nodejs-server
  minReplicas: 3
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
