        - name: CELERY_BROKER_URL
          value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq-service:5672/$(RABBITMQ_VHOST)"
        - name: CELERY_RESULT_BACKEND
