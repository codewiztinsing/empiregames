        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: DEBUG
        - name: ALLOWED_HOSTS
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: ALLOWED_HOSTS
        - name: BACK_URL
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: BACK_URL
        - name: MANUAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: liyu-secrets
              key: MANUAL_API_KEY
        - name: MANUAL_BASE_URL
          valueFrom:
            secretKeyRef:
              name: liyu-secrets
              key: MANUAL_BASE_URL
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: liyu-secrets
              key: POSTGRES_PASSWORD
        - name: RABBITMQ_USER
          valueFrom:
            configMapKeyRef:
              name: liyu-config
