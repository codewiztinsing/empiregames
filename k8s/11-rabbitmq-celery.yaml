---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-flower
  namespace: liyu-bingo
  labels:
    app: celery-flower
spec:
  replicas: 1  # Flower monitoring dashboard
  selector:
    matchLabels:
      app: celery-flower
  template:
    metadata:
      labels:
        app: celery-flower
    spec:
      containers:
      - name: celery-flower
        image: liyu-bingo/django:latest  # Same image as Django
        command: ["celery", "-A", "core", "flower", "--port=5555"]
        ports:
        - containerPort: 5555
        env:
        - name: DJANGO_SETTINGS_MODULE
          value: "core.settings_production"
        - name: CELERY_BROKER_URL
          value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq-service:5672/$(RABBITMQ_VHOST)"
        - name: CELERY_RESULT_BACKEND
          value: "rpc://"
        - name: FLOWER_BASIC_AUTH
          value: "admin:password"  # Change this in production
        - name: RABBITMQ_USER
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: RABBITMQ_USER
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: liyu-secrets
              key: RABBITMQ_PASSWORD
        - name: RABBITMQ_VHOST
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: RABBITMQ_VHOST
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 5555
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 5555
          initialDelaySeconds: 10
          periodSeconds: 10
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: celery-flower-service
  namespace: liyu-bingo
spec:
  selector:
    app: celery-flower
  ports:
  - port: 5555
    targetPort: 5555
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: celery-worker-hpa
  namespace: liyu-bingo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: celery-worker
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
