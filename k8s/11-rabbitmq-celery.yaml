apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: liyu-bingo
  labels:
    app: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3.12-management
        ports:
        - containerPort: 5672
          name: amqp
        - containerPort: 15672
          name: management
        env:
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: RABBITMQ_USER
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: liyu-secrets
              key: RABBITMQ_PASSWORD
        - name: RABBITMQ_DEFAULT_VHOST
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: RABBITMQ_VHOST
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - ping
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - name: rabbitmq-data
          mountPath: /var/lib/rabbitmq
      volumes:
      - name: rabbitmq-data
        persistentVolumeClaim:
          claimName: rabbitmq-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: liyu-bingo
spec:
  selector:
    app: rabbitmq
  ports:
  - port: 5672
    targetPort: 5672
    name: amqp
  - port: 15672
    targetPort: 15672
    name: management
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-pvc
  namespace: liyu-bingo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: liyu-bingo
  labels:
    app: celery-worker
spec:
  replicas: 3  # Horizontal scaling for Celery workers
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
      - name: celery-worker
        image: liyu-bingo/django:latest  # Same image as Django
        command: ["celery", "-A", "core", "worker", "-l", "info"]
        env:
        - name: DJANGO_SETTINGS_MODULE
          value: "core.settings_production"
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-service:5432/$(POSTGRES_DB)"
        - name: CELERY_BROKER_URL
          value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq-service:5672/$(RABBITMQ_VHOST)"
        - name: CELERY_RESULT_BACKEND
          value: "rpc://"
        - name: DJANGO_SECRET_KEY
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: DJANGO_SECRET_KEY
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: DEBUG
        - name: ALLOWED_HOSTS
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: ALLOWED_HOSTS
        - name: BACK_URL
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: BACK_URL
        - name: MANUAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: liyu-secrets
              key: MANUAL_API_KEY
        - name: MANUAL_BASE_URL
          valueFrom:
            secretKeyRef:
              name: liyu-secrets
              key: MANUAL_BASE_URL
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: liyu-secrets
              key: POSTGRES_PASSWORD
        - name: RABBITMQ_USER
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: RABBITMQ_USER
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: liyu-secrets
              key: RABBITMQ_PASSWORD
        - name: RABBITMQ_VHOST
          valueFrom:
            configMapKeyRef:
              name: liyu-config
              key: RABBITMQ_VHOST
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command:
            - celery
            - -A
            - core
            - inspect
            - ping
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - celery
            - -A
            - core
            - inspect
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
      restartPolicy: Always
---
