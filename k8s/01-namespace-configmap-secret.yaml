apiVersion: v1
kind: Namespace
metadata:
  name: liyu-bingo
  labels:
    name: liyu-bingo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: liyu-config
  namespace: liyu-bingo
data:
  # Django Settings
  DJANGO_SECRET_KEY: "your-secret-key-change-in-production"
  DEBUG: "False"
  ALLOWED_HOSTS: "akerbingo.com,*.akerbingo.com"
  
  # Database
  POSTGRES_DB: "liyu_bingo"
  POSTGRES_USER: "liyu_user"
  
  # Redis
  REDIS_URL: "redis://redis-service:6379/0"
  
  # Bot Settings
  BACK_URL: "https://akerbingo.com"
  
  # Node.js Settings
  NODE_ENV: "production"
  PORT: "3000"
  
  # React Settings
  REACT_APP_API_URL: "https://akerbingo.com/api"
  REACT_APP_SOCKET_URL: "wss://akerbingo.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: liyu-secrets
  namespace: liyu-bingo
type: Opaque
data:
  # Base64 encoded values - replace with actual values
  BOT_TOKEN: eW91ci1ib3QtdG9rZW4taGVyZQ==
  POSTGRES_PASSWORD: bGl5dV9wYXNzd29yZA==
  MANUAL_API_KEY: eW91ci1tYW51YWwtYXBpLWtleQ==
  MANUAL_BASE_URL: aHR0cHM6Ly95b3VyLW1hbnVhbC1hcGkuY29tLw==
