server {
    listen 80;
    server_name akerbingo.com www.akerbingo.com;

    root /var/www/bingo.bilen.com;
    index index.html;

    # Django static files (for admin, etc.)
    location /django_static/ {
        alias /var/www/django_static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # React static files
    location /static/ {
        alias /var/www/bingo.bilen.com/static/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    # ✅ Django Admin + Django backend
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
   location /dashboard/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
location /accounts/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # ✅ You can also add APIs here
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ✅ WebSocket / Socket.IO backend
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;   # Node.js server
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ✅ React frontend (index.html)
    location / {
        root /var/www/bingo.bilen.com;
        index index.html;
        try_files $uri /index.html;
    }

      }
