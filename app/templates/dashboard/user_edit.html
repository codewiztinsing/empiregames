{% extends 'dashboard/base.html' %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="p-6">
    <h1 class="text-2xl font-bold text-white mb-4">Edit User</h1>
    {% if error %}
    <div class="bg-red-900 text-red-100 border border-red-700 rounded p-3 mb-4">{{ error }}</div>
    {% endif %}
    <form method="post" class="bg-dark-card rounded-lg border border-dark-border p-6 max-w-xl">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-gray-300 mb-1">Username</label>
            <input type="text" name="username" value="{{ user_obj.username }}" class="w-full bg-dark-bg border border-dark-border text-white px-3 py-2 rounded" />
        </div>
        <div class="mb-4">
            <label class="block text-gray-300 mb-1">Phone</label>
            <input type="text" name="phone" value="{{ user_obj.phone }}" class="w-full bg-dark-bg border border-dark-border text-white px-3 py-2 rounded" />
        </div>
        <div class="mb-4">
            <label class="block text-gray-300 mb-1">Balance (ETB)</label>
            <input type="number" step="0.01" name="balance" value="{{ wallet.balance }}" class="w-full bg-dark-bg border border-dark-border text-white px-3 py-2 rounded" />
        </div>
        <div class="mb-4">
            <label class="inline-flex items-center text-gray-300">
                <input type="checkbox" name="is_agent" {% if user_obj.is_agent %}checked{% endif %} class="mr-2" /> Is Agent
            </label>
        </div>
        <div class="mb-4">
            <label class="inline-flex items-center text-gray-300">
                <input type="checkbox" name="sponsor_changed" {% if user_obj.sponsor_changed %}checked{% endif %} class="mr-2" /> Sponsor Changed
            </label>
        </div>
        <div class="mb-6">
            <label class="block text-gray-300 mb-1">Referred By (Telegram ID)</label>
            <input type="text" name="referred_by_telegram" value="{{ user_obj.referred_by.telegram_id }}" class="w-full bg-dark-bg border border-dark-border text-white px-3 py-2 rounded" />
            <p class="text-gray-500 text-sm mt-1">Leave blank to clear sponsorship.</p>
        </div>
        <div class="flex items-center space-x-3">
            <button type="submit" class="bg-purple-primary hover:bg-purple-hover text-white px-4 py-2 rounded">Save</button>
            <a href="{% url 'dashboard:users' %}" class="text-gray-300 hover:text-white">Cancel</a>
            <a href="{% url 'dashboard:user_delete' user_obj.id %}" class="text-red-400 hover:text-red-300">Delete</a>
        </div>
    </form>
</div>
{% endblock %}
