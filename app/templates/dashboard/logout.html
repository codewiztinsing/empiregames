{% extends 'dashboard/base.html' %}

{% block title %}Logout - Dashboard{% endblock %}

{% block content %}
<div class="min-h-screen bg-dark-bg flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div class="text-center">
            <div class="mx-auto h-12 w-12 flex items-center justify-center rounded-full bg-purple-primary/10">
                <svg class="h-6 w-6 text-purple-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
            </div>
            <h2 class="mt-6 text-3xl font-bold text-white">
                Sign Out
            </h2>
            <p class="mt-2 text-sm text-gray-400">
                Are you sure you want to sign out of your account?
            </p>
        </div>

        <div class="bg-dark-card rounded-lg shadow-lg p-6 border border-dark-border">
            <div class="space-y-4">
                <div class="flex items-center space-x-3 p-3 bg-dark-bg rounded-lg">
                    <div class="flex-shrink-0">
                        <div class="h-10 w-10 rounded-full bg-purple-primary/20 flex items-center justify-center">
                            <span class="text-sm font-medium text-purple-primary">AD</span>
                        </div>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium text-white truncate">
                            Admin User
                        </p>
                        <p class="text-sm text-gray-400 truncate">
                            admin@bingo.com
                        </p>
                    </div>
                </div>

                <div class="flex space-x-3">
                    <button type="button" onclick="window.history.back()" class="flex-1 bg-dark-bg border border-dark-border text-gray-300 py-2 px-4 rounded-lg text-sm font-medium hover:bg-dark-card transition-colors">
                        Cancel
                    </button>
                    <form method="post" action="{% url 'dashboard:logout' %}" class="flex-1">
                        {% csrf_token %}
                        <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white py-2 px-4 rounded-lg text-sm font-medium transition-colors">
                            Sign Out
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="text-center">
            <p class="text-xs text-gray-500">
                You will be redirected to the login page after signing out.
            </p>
        </div>
    </div>
</div>
{% endblock %}
