{% extends 'dashboard/base.html' %}
{% block content %}
<div class="container">
  <h1>Fake Players Settings</h1>
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label>Fake Players Count</label>
      <input type="number" class="form-control" name="fake_players_count" value="{{ setting.fake_players_count|default:0 }}" min="0" />
    </div>
    <div class="form-group mt-2">
      <label>Allow Fake Players to Win?</label>
      <select class="form-control" name="fake_can_win">
        <option value="false" {% if not setting.fake_can_win %}selected{% endif %}>No</option>
        <option value="true" {% if setting.fake_can_win %}selected{% endif %}>Yes</option>
      </select>
    </div>
    <div class="form-group mt-2">
      <label>Fake Win After Calls</label>
      <input type="number" class="form-control" name="fake_win_after_calls" value="{{ setting.fake_win_after_calls|default:10 }}" min="1" max="75" />
    </div>
    <button type="submit" class="btn btn-primary mt-3">Save</button>
  </form>
</div>
{% endblock %}
