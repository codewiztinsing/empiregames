version: '3.8'

services:
  liyu-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: liyu-bot
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings_production
      - BOT_TOKEN=${BOT_TOKEN}
      - BACK_URL=${BACK_URL}
      - MANUAL_API_KEY=${MANUAL_API_KEY}
      - MANUAL_BASE_URL=${MANUAL_BASE_URL}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=False
    volumes:
      - ./app/logs:/app/logs
      - ./app/media:/app/media
    depends_on:
      - postgres
      - redis
    networks:
      - liyu-network

  postgres:
    image: postgres:15
    container_name: liyu-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-liyu_bingo}
      - POSTGRES_USER=${POSTGRES_USER:-liyu_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-liyu_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - liyu-network

  redis:
    image: redis:7-alpine
    container_name: liyu-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - liyu-network

  nginx:
    image: nginx:alpine
    container_name: liyu-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - liyu-bot
    networks:
      - liyu-network

volumes:
  postgres_data:
  redis_data:

networks:
  liyu-network:
    driver: bridge
